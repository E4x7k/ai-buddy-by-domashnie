version: '3.8'

services:
  # Сервис бэкенда (FastAPI)
  backend:
    build: .
    container_name: ai_buddy_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./db_data:/app/db_data
      - ./models:/app/models

  # Сервис фронтенда (Streamlit)
  frontend:
    build: .
    container_name: ai_buddy_frontend
    command: ["uv", "run", "streamlit", "run", "client/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      # КЛЮЧЕВОЙ МОМЕНТ: внутри Docker-сети фронт должен обращаться к сервису по его имени
      - API_URL=http://backend:8000