version: '3.8'

services:
  backend:
    build: .
    container_name: ai_buddy_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./db_data:/app/db_data
      - ./models:/app/models
    command: >
      sh -c "uv run python setup_embedder.py &&
             uv run python -m ml_core.ingest &&
             uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: .
    container_name: ai_buddy_frontend
    command: ["uv", "run", "streamlit", "run", "client/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000